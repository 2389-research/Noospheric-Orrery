<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noospheric Orrery — System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #01040a; color: #c0c8e0; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; cursor: grab; z-index: 1; }
canvas:active { cursor: grabbing; }
#hud {
  position: fixed; top: 12px; left: 14px; z-index: 10;
  font-size: 10px; letter-spacing: .08em; line-height: 1.8; pointer-events: none;
}
#hud .title { font-size: 13px; color: rgba(180,140,220,0.9); letter-spacing: .12em; margin-bottom: 4px; }
#hud .info { color: rgba(160,130,200,0.6); }
#hud .sub { color: rgba(160,130,200,0.35); }
#tooltip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: rgba(6,13,34,0.95); border: 0.5px solid rgba(160,130,220,0.25);
  border-radius: 4px; padding: 8px 12px; min-width: 200px; max-width: 320px;
  font: 10px 'Courier New', monospace; color: rgba(220,210,240,0.8); line-height: 1.9;
}
#tooltip .tt-title { font-size: 11px; color: rgba(180,140,220,0.95); margin-bottom: 4px; letter-spacing: .06em; }
#tooltip .tt-type { font-size: 9px; display: inline-block; padding: 1px 6px; border-radius: 2px; margin-bottom: 3px; }
#tooltip .tt-dim { color: rgba(160,130,200,0.4); font-size: 9px; }
#back-btn {
  position: fixed; top: 12px; right: 14px; z-index: 10;
  font: 10px 'Courier New', monospace; padding: 5px 14px;
  border: 0.5px solid rgba(160,130,200,0.3); border-radius: 3px;
  color: rgba(160,130,200,0.6); background: rgba(160,130,200,0.05);
  cursor: pointer; letter-spacing: .08em; transition: all .12s;
}
#back-btn:hover { color: rgba(180,150,220,1); border-color: rgba(180,150,220,0.7); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="title" id="hud-title">◎ LOADING...</div>
  <div class="info" id="hud-info"></div>
  <div class="sub" id="hud-sub"></div>
</div>
<div id="tooltip"></div>
<button id="back-btn" onclick="goBack()">← sector</button>

<script type="module">
import { Camera } from './core/camera.js';
import { sin, cos, hexRGB, rgba, WORLD_W, WORLD_H, sqrt, clamp, random, hypot, TAU, assignDomainColors, blendColors } from './core/utils.js';
import { drawBackground } from './renderers/galaxy.js';
import { drawSystemCore, drawSystemEntities } from './renderers/system.js';

const canvas = document.getElementById('c');
const camera = new Camera();
let W, H, ctx;
let tick = 0;

const params = new URLSearchParams(location.search);
let focusDomainPath = params.get('domain') || '';

let domainNode = null;
const entities = [];
const ghostDomains = [];  // neighboring domains as gravitational ghosts
let hoveredEntityId = null;
let labelThreshold = 0;

const API_URL = new URLSearchParams(location.search).get('api') || '/api';
const AUTH_TOKEN = new URLSearchParams(location.search).get('token') || '';
const WORKSPACE_ID = new URLSearchParams(location.search).get('workspace') || '';
const fetchHeaders = {};
if (AUTH_TOKEN) fetchHeaders['Authorization'] = `Bearer ${AUTH_TOKEN}`;
if (WORKSPACE_ID) fetchHeaders['X-Workspace-Id'] = WORKSPACE_ID;
console.log('System view: fetching', `${API_URL}/graph`, 'domain:', focusDomainPath);
fetch(`${API_URL}/graph`, { headers: fetchHeaders }).then(r => {
  console.log('System view: got response', r.status);
  return r.json();
}).then(data => {
  console.log('System view: parsed data, domains:', Object.keys(data.domain_positions).length);
  // If no domain specified, pick the one with most entities
  if (!focusDomainPath) {
    const counts = {};
    for (const ent of (data.entities || [])) {
      for (const path of Object.keys(ent.domainWeights || {})) {
        counts[path] = (counts[path] || 0) + 1;
      }
    }
    focusDomainPath = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    console.log('System view: auto-picked domain:', focusDomainPath);
  }
  buildSystemView(data);
}).catch(err => {
  console.error('System view: fetch failed', err);
  document.getElementById('hud-title').textContent = '◎ FETCH FAILED';
});

// Search glow
window.addEventListener('message', e => {
  if (e.data?.type === 'search_result' && e.data.entities) {
    triggerSearchGlow(e.data.entities);
  }
});

// Back navigation
window.goBack = function() {
  if (focusDomainPath) {
    window.parent.postMessage({ type: 'navigate_sector', domain: focusDomainPath }, '*');
  } else {
    window.parent.postMessage({ type: 'navigate_galaxy' }, '*');
  }
};

function buildSystemView(data) {
  // Colors
  const domainList = Object.keys(data.domain_positions).map(path => ({
    path,
    spec_version: data.domain_specs?.[path]?.spec_version ?? null,
  }));
  const domainColors = assignDomainColors(domainList);
  if (data.region_colors) {
    for (const [path, color] of Object.entries(data.region_colors)) {
      if (!domainColors[path]) domainColors[path] = color;
    }
  }

  // Build the focused domain
  const PADDING = 0.08;
  const pos = data.domain_positions[focusDomainPath];
  if (!pos) {
    document.getElementById('hud-title').textContent = '◎ DOMAIN NOT FOUND';
    return;
  }

  const specs = data.domain_specs || {};
  const hasSpec = specs[focusDomainPath] && specs[focusDomainPath].spec_version > 0;
  const specVersion = specs[focusDomainPath]?.spec_version || 0;
  const vc = data.domain_video_counts?.[focusDomainPath] || 0;
  const isSimmering = (data.active_simmers || []).includes(focusDomainPath);

  // Maturity
  const allPaths = Object.keys(data.domain_positions);
  const subdoms = allPaths.filter(p => p.startsWith(focusDomainPath + '/') && p !== focusDomainPath);
  let maturity = 0;
  if (subdoms.length === 0) {
    maturity = hasSpec ? 1.0 : 0.0;
  } else {
    const subWithSpec = subdoms.filter(p => specs[p] && specs[p].spec_version > 0).length;
    maturity = hasSpec ? 0.5 + subWithSpec / subdoms.length * 0.5 : subWithSpec / subdoms.length * 0.4;
  }

  const wx = (PADDING + pos.x * (1 - 2 * PADDING)) * WORLD_W;
  const wy = (PADDING + pos.y * (1 - 2 * PADDING)) * WORLD_H;

  domainNode = {
    id: 'dom:' + focusDomainPath,
    path: focusDomainPath,
    label: focusDomainPath,
    color: domainColors[focusDomainPath] || '#81d4fa',
    radius: 300, // large for system view
    x: wx, y: wy,
    docCount: vc,
    maturity,
    specVersion,
    simmering: isSimmering,
    rot: random() * TAU,
    activityGlow: 0,
  };

  // Build position map for ALL domains (for gravitational pull)
  const allDomPositions = {};
  for (const [path, p] of Object.entries(data.domain_positions)) {
    allDomPositions[path] = {
      x: (PADDING + p.x * (1 - 2 * PADDING)) * WORLD_W,
      y: (PADDING + p.y * (1 - 2 * PADDING)) * WORLD_H,
    };
  }

  // Find neighboring domains — any domain that shares entities with focused domain
  const neighborPaths = new Set();
  for (const ent of (data.entities || [])) {
    const dw = ent.domainWeights || {};
    if (focusDomainPath in dw) {
      for (const path of Object.keys(dw)) {
        if (path !== focusDomainPath) neighborPaths.add(path);
      }
    }
  }

  // Place ghost domains evenly around the circle
  // Sort by real UMAP angle to preserve relative ordering, then redistribute
  const ghostList = [];
  for (const path of neighborPaths) {
    const realPos = allDomPositions[path];
    if (!realPos) continue;
    const dx = realPos.x - wx;
    const dy = realPos.y - wy;
    ghostList.push({ path, realAngle: Math.atan2(dy, dx) });
  }
  // Sort by real angle to preserve spatial relationships
  ghostList.sort((a, b) => a.realAngle - b.realAngle);

  // Redistribute evenly around full circle
  const ghostDist = 700;
  for (let i = 0; i < ghostList.length; i++) {
    const g = ghostList[i];
    const angle = (i / ghostList.length) * TAU - Math.PI; // spread full 360°
    ghostDomains.push({
      path: g.path,
      label: g.path.split('/').pop(),
      color: domainColors[g.path] || '#81d4fa',
      x: wx + cos(angle) * ghostDist,
      y: wy + sin(angle) * ghostDist,
      radius: 60,
      dirX: cos(angle),
      dirY: sin(angle),
    });
  }

  // All entities belonging to this domain
  const domEntities = (data.entities || [])
    .filter(ent => {
      const dw = ent.domainWeights || {};
      return focusDomainPath in dw;
    })
    .sort((a, b) => (b.videoCount || 0) - (a.videoCount || 0));

  // Compute label threshold (top 30%)
  const counts = domEntities.map(e => e.videoCount || 0).sort((a, b) => b - a);
  const idx30 = Math.floor(counts.length * 0.3);
  labelThreshold = counts[idx30] || 1;

  // Place entities: angle encodes pull direction, radius encodes focus weight
  // Single-domain entities spread evenly near core
  // Bridge entities point toward their other domains
  const GOLDEN_ANGLE = 2.399963;
  let singleIdx = 0; // counter for single-domain golden angle
  for (let i = 0; i < domEntities.length; i++) {
    const ent = domEntities[i];
    const dw = ent.domainWeights || {};
    const domNames = Object.keys(dw);
    const isBridge = domNames.length > 1;
    const vc = ent.videoCount || 0;
    const focusWeight = dw[focusDomainPath] || 0;

    // Radius: rank-based (sorted by sourceCount desc, so i=0 is most important)
    // Most important entities near core, least important at the edge
    // focusWeight nudges: less owned by this domain → pushed slightly further out
    const rankT = i / Math.max(domEntities.length - 1, 1); // 0 (top) → 1 (bottom)
    const baseR = 60 + rankT * 480 + (1 - focusWeight) * 80;

    let angle;
    if (isBridge) {
      // Angle: weighted average direction toward other domains' ghosts
      let pullX = 0, pullY = 0;
      for (const [path, w] of Object.entries(dw)) {
        if (path === focusDomainPath) continue;
        const ghost = ghostDomains.find(g => g.path === path);
        if (!ghost) continue;
        pullX += ghost.dirX * w;
        pullY += ghost.dirY * w;
      }
      if (hypot(pullX, pullY) > 0.001) {
        angle = Math.atan2(pullY, pullX);
        // Spread so entities sharing the same pull direction don't stack
        angle += (random() - 0.5) * 0.8;
      } else {
        angle = singleIdx * GOLDEN_ANGLE;
        singleIdx++;
      }
    } else {
      // Single-domain: golden angle spiral around core
      angle = singleIdx * GOLDEN_ANGLE;
      singleIdx++;
    }

    // Radial jitter
    const r = baseR + (random() - 0.5) * 80;

    const ex = wx + cos(angle) * r;
    const ey = wy + sin(angle) * r;

    entities.push({
      id: ent.entityId,
      name: ent.name,
      type: ent.type,
      color: domainColors[focusDomainPath] || '#81d4fa',
      radius: 4 + Math.min(sqrt(vc) * 2.5, 20),
      x: ex,
      y: ey,
      _px: ex, _py: ey,
      sourceCount: vc,
      domainWeights: dw,
      bridge: isBridge,
      domainNames: domNames,
      activityGlow: 0,
      orbitPhase: random() * TAU,
      orbitSpeed: 0.6 + random() * 0.8,
      orbitDrift: 6 + random() * 12,
    });
  }

  // Center camera
  camera.x = wx;
  camera.y = wy;
  camera.zoom = 1.0;
  camera.targetZoom = 1.0;

  // HUD
  const name = focusDomainPath.split('/').pop();
  document.getElementById('hud-title').textContent = `◎ ${name.toUpperCase()}`;
  document.getElementById('hud-info').textContent =
    `${domEntities.length} entities · ${vc} docs · ${hasSpec ? 'spec v' + specVersion : 'no spec'}`;
  document.getElementById('hud-sub').textContent = focusDomainPath;

  console.log(`System loaded: ${domEntities.length} entities, label threshold: ${labelThreshold}`);
}

function triggerSearchGlow(entityNames) {
  for (const name of entityNames) {
    const nameLower = name.toLowerCase();
    for (const e of entities) {
      if (e.name.toLowerCase() === nameLower) {
        e.activityGlow = Math.min(1.0, e.activityGlow + 0.85);
        break;
      }
    }
  }
  // Domain core pulse
  if (domainNode) {
    domainNode.activityGlow = Math.min(1.0, domainNode.activityGlow + 0.6);
  }
}

// Hit test entities
function hitTest(wx, wy) {
  // Hit radius matches visible glow — radius * 1.2 + small buffer
  for (const e of entities) {
    const dist = hypot(wx - e._px, wy - e._py);
    if (dist < (e.radius * 1.2 + 6)) return { kind: 'entity', obj: e };
  }
  // Domain core
  if (domainNode && hypot(wx - domainNode.x, wy - domainNode.y) < domainNode.radius * 0.3) {
    return { kind: 'domain', obj: domainNode };
  }
  return null;
}

// Input
canvas.addEventListener('mousedown', e => camera.handleMouseDown(e));
canvas.addEventListener('mousemove', e => {
  if (camera.handleMouseDrag(e)) return;
  W = canvas.width / devicePixelRatio;
  H = canvas.height / devicePixelRatio;
  const w = camera.screenToWorld(e.clientX, e.clientY, W, H);
  const hit = hitTest(w.x, w.y);

  hoveredEntityId = null;
  canvas.style.cursor = hit ? 'pointer' : 'grab';

  const tt = document.getElementById('tooltip');
  if (hit && hit.kind === 'entity') {
    hoveredEntityId = hit.obj.id;
    const ent = hit.obj;
    const doms = ent.domainNames.map(p => p.split('/').pop()).join(', ');
    const typeCol = {
      Person:'55,138,221', Organization:'127,119,221', Product:'29,158,117',
      Technology:'186,117,23', Event:'216,90,48', Concept:'156,154,146',
      Location:'93,202,165', Process:'107,186,204', Tool:'186,117,23',
    }[ent.type] || '156,154,146';

    tt.style.display = 'block';
    tt.style.left = Math.min(e.clientX + 14, W - 320) + 'px';
    tt.style.top = Math.min(e.clientY - 8, H - 120) + 'px';
    tt.innerHTML = `<div class="tt-title">${ent.name}</div>
      <div class="tt-type" style="background:rgba(${typeCol},0.15);color:rgba(${typeCol},0.9)">${ent.type}</div>
      <div>${ent.sourceCount} docs · ${doms}</div>
      ${ent.bridge ? '<div style="color:rgba(180,160,220,0.6)">bridge entity — spans multiple domains</div>' : ''}
      <div class="tt-dim">click to enter star view</div>`;
  } else if (hit && hit.kind === 'domain') {
    tt.style.display = 'block';
    tt.style.left = Math.min(e.clientX + 14, W - 300) + 'px';
    tt.style.top = Math.min(e.clientY - 8, H - 100) + 'px';
    tt.innerHTML = `<div class="tt-title">${domainNode.label.split('/').pop()}</div>
      <div>${domainNode.docCount} docs · ${entities.length} entities</div>
      <div class="tt-dim">click to go back to sector</div>`;
  } else {
    tt.style.display = 'none';
  }
});

canvas.addEventListener('mouseup', e => {
  const wasDrag = camera.didDrag;
  camera.handleMouseUp();

  if (!wasDrag) {
    W = canvas.width / devicePixelRatio;
    H = canvas.height / devicePixelRatio;
    const w = camera.screenToWorld(e.clientX, e.clientY, W, H);
    const hit = hitTest(w.x, w.y);

    if (hit) {
      if (hit.kind === 'entity') {
        camera.flyTo(hit.obj._px, hit.obj._py, 2.5, 800);
        window.parent.postMessage({
          type: 'node_selected', nodeType: 'entity',
          data: { id: hit.obj.id, name: hit.obj.name, entityType: hit.obj.type, source_count: hit.obj.sourceCount, domain_weights: hit.obj.domainWeights }
        }, '*');
      } else if (hit.kind === 'domain') {
        // Go back to sector
        window.goBack();
      }
    }
  }
});

canvas.addEventListener('wheel', e => camera.handleWheel(e), { passive: false });

// Render loop
function frame() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

  tick++;
  camera.update();

  // Decay
  if (domainNode) {
    if (domainNode.activityGlow > 0) domainNode.activityGlow = Math.max(0, domainNode.activityGlow - 0.0018 * 16.67);
    domainNode.rot = (domainNode.rot || 0) + 0.0003;
  }
  for (const e of entities) {
    if (e.activityGlow > 0) e.activityGlow = Math.max(0, e.activityGlow - 0.0018 * 16.67);
  }

  // Draw
  drawBackground(ctx, W, H, tick);

  ctx.save();
  camera.applyTransform(ctx, W, H);

  if (domainNode) {
    // Ghost domains — dim gravitational attractors at the edges
    for (const ghost of ghostDomains) {
      const [gr, gg, gb] = hexRGB(ghost.color);
      // Faint nebula
      const g1 = ctx.createRadialGradient(ghost.x, ghost.y, 0, ghost.x, ghost.y, ghost.radius * 2.5);
      g1.addColorStop(0, rgba(gr, gg, gb, 0.025));
      g1.addColorStop(0.5, rgba(gr, gg, gb, 0.010));
      g1.addColorStop(1, rgba(gr, gg, gb, 0));
      ctx.fillStyle = g1;
      ctx.beginPath();
      ctx.arc(ghost.x, ghost.y, ghost.radius * 2.5, 0, TAU);
      ctx.fill();
      // Dim core dot
      ctx.fillStyle = rgba(gr, gg, gb, 0.12);
      ctx.beginPath();
      ctx.arc(ghost.x, ghost.y, 4, 0, TAU);
      ctx.fill();
      // Label
      ctx.fillStyle = rgba(gr, gg, gb, 0.22);
      ctx.font = "16px 'Courier New', monospace";
      ctx.textAlign = 'center';
      ctx.fillText(ghost.label, ghost.x, ghost.y + ghost.radius * 2 + 14);
    }

    // Gravitational field lines — faint dashed lines from core to ghost domains
    for (const ghost of ghostDomains) {
      const [gr, gg, gb] = hexRGB(ghost.color);
      ctx.setLineDash([4, 14]);
      ctx.strokeStyle = rgba(gr, gg, gb, 0.06);
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(domainNode.x, domainNode.y);
      ctx.lineTo(ghost.x, ghost.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    drawSystemCore(ctx, domainNode, tick);
    drawSystemEntities(ctx, entities, tick, hoveredEntityId, labelThreshold);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
