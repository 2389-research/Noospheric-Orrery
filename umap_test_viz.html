<!DOCTYPE html>
<html>
<head>
<title>UMAP Domain Layout Test</title>
<style>
body { background: #0a0e1a; color: #e8eaf0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
h2 { font-size: 12px; color: rgba(140,200,255,0.6); text-transform: uppercase; letter-spacing: 2px; }
canvas { border: 1px solid rgba(100,180,255,0.15); border-radius: 8px; display: block; margin: 20px auto; }
.legend { font-size: 10px; color: rgba(140,200,255,0.5); text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<h2>Universal UMAP — Domain Positions from Cloud Run transform()</h2>
<canvas id="viz" width="800" height="600"></canvas>
<div class="legend">Business domains cluster right · Hobby/gaming domains cluster left · Positions computed via UMAP transform() on Cloud Run (x86)</div>

<script>
const positions = {
  "business/finance/fundraising": {"x": 0.939, "y": 0.363},
  "business/finance/venture_capital": {"x": 1.0, "y": 0.503},
  "business/networking/investor_relations": {"x": 0.927, "y": 0.356},
  "entertainment/games/warhammer_40k": {"x": 0.088, "y": 0.770},
  "hobbies/crafts/scale_modeling": {"x": 0.181, "y": 0.615},
  "hobbies/tabletop_gaming/miniature_painting": {"x": 0.148, "y": 0.650},
  "hobbies/tabletop_gaming/wargaming": {"x": 0.157, "y": 0.427}
};

// Color by top-level category
const colors = {
  "business": "#378ADD",
  "entertainment": "#D85A30",
  "hobbies": "#1D9E75",
};

const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const pad = 80;

// Background
ctx.fillStyle = '#0a0e1a';
ctx.fillRect(0, 0, W, H);

// Grid
ctx.strokeStyle = 'rgba(100,180,255,0.06)';
ctx.lineWidth = 1;
for (let i = 0; i <= 10; i++) {
  const x = pad + (i / 10) * (W - 2 * pad);
  const y = pad + (i / 10) * (H - 2 * pad);
  ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, H - pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
}

// Draw domains
for (const [path, pos] of Object.entries(positions)) {
  const x = pad + pos.x * (W - 2 * pad);
  const y = pad + pos.y * (H - 2 * pad);
  const top = path.split('/')[0];
  const color = colors[top] || '#9c9a92';
  const label = path.split('/').pop().replace(/_/g, ' ');

  // Glow
  const grad = ctx.createRadialGradient(x, y, 0, x, y, 30);
  grad.addColorStop(0, color + '40');
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.fill();

  // Dot
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();

  // Ring
  ctx.strokeStyle = color + '80';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.stroke();

  // Label
  ctx.fillStyle = '#e8eaf0';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y - 16);

  // Category label
  ctx.fillStyle = color + '80';
  ctx.font = '8px Courier New';
  ctx.fillText(top, x, y - 6);
}

// Draw connections between same top-level
const entries = Object.entries(positions);
for (let i = 0; i < entries.length; i++) {
  for (let j = i + 1; j < entries.length; j++) {
    const topA = entries[i][0].split('/')[0];
    const topB = entries[j][0].split('/')[0];
    if (topA === topB) {
      const ax = pad + entries[i][1].x * (W - 2 * pad);
      const ay = pad + entries[i][1].y * (H - 2 * pad);
      const bx = pad + entries[j][1].x * (W - 2 * pad);
      const by = pad + entries[j][1].y * (H - 2 * pad);
      const color = colors[topA] || '#9c9a92';
      ctx.strokeStyle = color + '20';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
  }
}
</script>
</body>
</html>
