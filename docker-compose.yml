# Default deployment — SQLite, no cloud dependencies beyond LLM API.
#
# Usage:
#   cp .env.example .env   # add your credentials (Bedrock or Anthropic API)
#   docker compose up
#
# NOTE: On ARM Macs, torch/sentence-transformers crash in Docker (SIGILL).
# The orchestrator uses circular layout by default. For UMAP, run natively.

services:
  orchestrator:
    image: ghcr.io/2389-research/orrery-orchestrator:latest
    build:
      context: .
      dockerfile: orchestrator/Dockerfile.local
    ports:
      - "8100:8000"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - DB_PATH=/data/orrery.db
      - DOCUMENTS_DIR=/data/documents
      - SPECS_DIR=/data/specs
      - AUTH_REQUIRED=false
      # Threadsafe Numba — sentence-transformers/UMAP can be hit concurrently
      # (workspace switch fires multiple parallel queries) and the default
      # workqueue layer crashes the process. OpenMP is threadsafe and works
      # on both arm64 and x86_64 (Intel TBB has no arm64 wheel).
      - NUMBA_THREADING_LAYER=omp
      # No torch in Docker — circular layout. For UMAP, run natively.

  worker:
    image: ghcr.io/2389-research/orrery-worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - DB_PATH=/data/orrery.db
      - DOCUMENTS_DIR=/data/documents
      - SPECS_DIR=/data/specs
    depends_on:
      - orchestrator

  frontend:
    image: ghcr.io/2389-research/orrery-frontend:latest
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_AUTH_MODE=noop
        - BACKEND_URL=http://orchestrator:8000
    ports:
      - "3100:3000"
    depends_on:
      - orchestrator

# Data lives at ./data/ on the host — persists through container restarts,
# rebuilds, and prunes. To reset: rm -rf ./data/
