services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8100:8000"
    volumes:
      - orrery-data:/data
    env_file: .env
    depends_on: []

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - orrery-data:/data
    env_file: .env
    depends_on: []

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://orchestrator:8000
    ports:
      - "3100:3000"
    environment:
      - BACKEND_URL=http://orchestrator:8000
    depends_on:
      - orchestrator

volumes:
  orrery-data:
