services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8100:8000"
    volumes:
      - orrery-data:/data
    env_file: .env
    depends_on: []

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - orrery-data:/data
    env_file: .env
    depends_on: []

  frontend:
    build: ./frontend
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8100
    depends_on:
      - orchestrator

volumes:
  orrery-data:
