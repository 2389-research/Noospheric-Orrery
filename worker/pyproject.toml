[project]
name = "orrery-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=0.40.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    # simmer-sdk: install from PyPI or local path (see worker/Dockerfile)
    # "simmer-sdk>=0.2.0",
    "orrery-relay",
    "orrery-codesum",
    "orrery-tracksum",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
orrery-relay = { path = "../packages/orrery-relay" }
orrery-codesum = { path = "../packages/orrery-codesum" }
orrery-tracksum = { path = "../packages/orrery-tracksum" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
