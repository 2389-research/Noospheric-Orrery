[project]
name = "orrery-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=0.40.0",
    # simmer-sdk installed separately in Dockerfile from local copy
    # sentence-transformers deferred until embedding normalization is implemented
    # "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
