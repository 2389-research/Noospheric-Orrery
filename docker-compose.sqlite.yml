# Local deployment — SQLite, no Firebase, no cloud dependencies.
# Usage: docker-compose -f docker-compose.sqlite.yml up
#
# NOTE: On ARM Macs, torch/sentence-transformers crash in Docker (SIGILL).
# Set DISABLE_LOCAL_EMBEDDINGS=1 (already set below) for circular layout.
# For full UMAP layout, run natively instead of Docker (see below).
#
# Native dev (recommended on ARM Mac):
#   cd orchestrator && pip install -e '.[local]' && uvicorn src.main:app --port 8100
#   cd worker && pip install -e . && python -m src.main
#   cd frontend && NEXT_PUBLIC_AUTH_MODE=noop BACKEND_URL=http://localhost:8100 npm run dev
#
# Requires: .env file with ANTHROPIC_BACKEND + credentials

services:
  orchestrator:
    image: ghcr.io/2389-research/orrery-orchestrator:latest
    build:
      context: .
      dockerfile: orchestrator/Dockerfile.local
    ports:
      - "8100:8000"
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - DB_BACKEND=sqlite
      - DB_PATH=/data/orrery.db
      - DOCUMENTS_DIR=/data/documents
      - SPECS_DIR=/data/specs
      - AUTH_REQUIRED=false
      # No torch in Docker — circular layout. For UMAP, run natively.

  worker:
    image: ghcr.io/2389-research/orrery-worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - ./data:/data
    env_file: .env
    environment:
      - DB_PATH=/data/orrery.db
      - DOCUMENTS_DIR=/data/documents
      - SPECS_DIR=/data/specs
    depends_on:
      - orchestrator

  frontend:
    image: ghcr.io/2389-research/orrery-frontend:latest
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_AUTH_MODE=noop
        - BACKEND_URL=http://orchestrator:8000
    ports:
      - "3100:3000"
    depends_on:
      - orchestrator

# Data lives at ./data/ on the host — persists through container restarts,
# rebuilds, and prunes. To reset: rm -rf ./data/
