# Firebase App Hosting configuration
# Deploys the Next.js frontend from the /frontend directory

settings:
  rootDirectory: frontend

runConfig:
  minInstances: 0
  maxInstances: 3
  memoryMiB: 512
  cpu: 1
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_API_URL
    value: https://orrery-orchestrator-469580747258.us-central1.run.app
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBtvm3TYEn2fIFgV0lJrjcnBQe6K0nm1NI
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: noospheric-orrery.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: noospheric-orrery
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
